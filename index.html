<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDG Pro App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --font-mono: 'Fira Code', 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 0.8rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    header h1 {
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 0.5rem;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    .app-container {
      display: grid;
      grid-template-columns: 320px 1fr 420px;
      flex: 1;
      overflow: hidden;
    }

    .panel {
      padding: 1.25rem;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-dark);
    }

    .panel:last-child {
      border-right: none;
    }

    .panel-title {
      font-size: 0.95rem;
      margin-bottom: 1rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .module-controls {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }

    .module-controls.active {
      display: flex;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    input[type="text"], input[type="number"], input[type="color"], select, input[type="range"] {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .preview-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #020617;
      position: relative;
    }

    /* Componente de Vista Previa */
    .demo-element {
      padding: 2rem;
      border-radius: var(--pv-radius, 8px);
      background-color: var(--pv-bg, #1e293b);
      border: 1px solid var(--pv-color, #38bdf8);
      box-shadow: var(--pv-shadow, none);
      max-width: 280px;
      width: 100%;
      text-align: center;
      transition: box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .demo-btn {
      margin-top: 1rem;
      padding: 0.5rem 1.25rem;
      border: none;
      border-radius: calc(var(--pv-radius, 8px) / 2);
      background-color: var(--pv-color, #38bdf8);
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
    }

    /* Corrección de estilos para el bloque de código */
    .code-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0d1117;
    }

    pre[class*="language-"] {
      margin: 0 !important;
      padding: 1rem !important;
      background: transparent !important;
      height: 100%;
      overflow: auto;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    code[class*="language-"] {
      font-family: var(--font-mono);
    }

    .copy-btn {
      margin-top: 1rem;
      padding: 0.6rem;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .copy-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <header>
    <h1>CDG Pro App</h1>
    <nav class="nav-tabs">
      <button class="tab-btn active" onclick="switchModule(event, 'tokens')">Tokens & Estilos</button>
      <button class="tab-btn" onclick="switchModule(event, 'shadow')">Box Shadow</button>
      <button class="tab-btn" onclick="switchModule(event, 'converter')">Px a Rem</button>
    </nav>
  </header>

  <div class="app-container">
    <section class="panel">
      <div id="controls-tokens" class="module-controls active">
        <div class="panel-title">Tokens & UI</div>
        <div class="control-group">
          <label for="tokColor">Color Accento</label>
          <input type="color" id="tokColor" value="#38bdf8">
        </div>
        <div class="control-group">
          <label for="tokBg">Fondo Superficie</label>
          <input type="color" id="tokBg" value="#1e293b">
        </div>
        <div class="control-group">
          <label for="tokRadius">Border Radius: <span id="valRadius">8px</span></label>
          <input type="range" id="tokRadius" min="0" max="30" value="8">
        </div>
      </div>

      <div id="controls-shadow" class="module-controls">
        <div class="panel-title">Sombra CSS</div>
        <div class="control-group">
          <label for="shdOffsetX">Offset X: <span id="valOffsetX">0px</span></label>
          <input type="range" id="shdOffsetX" min="-50" max="50" value="0">
        </div>
        <div class="control-group">
          <label for="shdOffsetY">Offset Y: <span id="valOffsetY">10px</span></label>
          <input type="range" id="shdOffsetY" min="-50" max="50" value="10">
        </div>
        <div class="control-group">
          <label for="shdBlur">Blur Radius: <span id="valBlur">15px</span></label>
          <input type="range" id="shdBlur" min="0" max="100" value="15">
        </div>
        <div class="control-group">
          <label for="shdSpread">Spread Radius: <span id="valSpread">-3px</span></label>
          <input type="range" id="shdSpread" min="-30" max="30" value="-3">
        </div>
        <div class="control-group">
          <label for="shdColor">Color Sombra</label>
          <input type="color" id="shdColor" value="#000000">
        </div>
        <div class="control-group">
          <label for="shdOpacity">Opacidad: <span id="valOpacity">0.5</span></label>
          <input type="range" id="shdOpacity" min="0" max="1" step="0.05" value="0.5">
        </div>
      </div>

      <div id="controls-converter" class="module-controls">
        <div class="panel-title">Conversor PX / REM</div>
        <div class="control-group">
          <label for="basePx">Tamaño Base Font-Size (px)</label>
          <input type="number" id="basePx" value="16">
        </div>
        <div class="control-group">
          <label for="inputPx">Valor en Píxeles (px)</label>
          <input type="number" id="inputPx" value="24">
        </div>
      </div>
    </section>

    <section class="panel preview-area">
      <div class="demo-element" id="demoCard">
        <h3>Vista Previa</h3>
        <p style="margin-top: 0.5rem; color: #94a3b8; font-size: 0.85rem;">
          Comprobación interactiva en tiempo real.
        </p>
        <button class="demo-btn">Acción</button>
      </div>
    </section>

    <section class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem;">
        <span class="panel-title" style="margin:0;">Código Generado</span>
        <select id="exportFormat" style="width: 140px; padding: 0.2rem 0.4rem;">
          <option value="css">CSS Variables</option>
          <option value="scss">SCSS</option>
          <option value="json">DTCG JSON</option>
          <option value="ts">TypeScript</option>
          <option value="tailwind">Tailwind v4</option>
        </select>
      </div>

      <div class="code-wrapper">
        <pre><code id="codeBlock" class="language-css"></code></pre>
      </div>
      <button class="copy-btn" onclick="copyCode()">Copiar Código</button>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-scss.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>

  <script>
    let currentModule = 'tokens';

    const demoCard = document.getElementById('demoCard');
    const codeBlock = document.getElementById('codeBlock');
    const exportFormatSelect = document.getElementById('exportFormat');

    function switchModule(event, moduleName) {
      currentModule = moduleName;
      
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.module-controls').forEach(ctl => ctl.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(`controls-${moduleName}`).classList.add('active');

      render();
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function render() {
      let generatedCode = '';
      let codeLanguage = 'css';
      const format = exportFormatSelect.value;

      if (currentModule === 'tokens') {
        const color = document.getElementById('tokColor').value;
        const bg = document.getElementById('tokBg').value;
        const radius = document.getElementById('tokRadius').value;

        document.getElementById('valRadius').innerText = `${radius}px`;

        demoCard.style.setProperty('--pv-color', color);
        demoCard.style.setProperty('--pv-bg', bg);
        demoCard.style.setProperty('--pv-radius', `${radius}px`);
        demoCard.style.setProperty('--pv-shadow', 'none');

        if (format === 'css') {
          codeLanguage = 'css';
          generatedCode = `:root {\n  --primary-color: ${color};\n  --bg-surface: ${bg};\n  --border-radius: ${radius}px;\n}`;
        } else if (format === 'scss') {
          codeLanguage = 'scss';
          generatedCode = `$primary-color: ${color};\n$bg-surface: ${bg};\n$border-radius: ${radius}px;`;
        } else if (format === 'json') {
          codeLanguage = 'json';
          generatedCode = JSON.stringify({
            color: { primary: { value: color, type: "color" }, surface: { value: bg, type: "color" } },
            borderRadius: { default: { value: `${radius}px`, type: "dimension" } }
          }, null, 2);
        } else if (format === 'ts') {
          codeLanguage = 'typescript';
          generatedCode = `export const designTokens = {\n  primaryColor: "${color}",\n  bgSurface: "${bg}",\n  borderRadius: "${radius}px",\n} as const;`;
        } else if (format === 'tailwind') {
          codeLanguage = 'css';
          generatedCode = `@theme {\n  --color-primary: ${color};\n  --color-surface: ${bg};\n  --radius-default: ${radius}px;\n}`;
        }

      } else if (currentModule === 'shadow') {
        const x = document.getElementById('shdOffsetX').value;
        const y = document.getElementById('shdOffsetY').value;
        const blur = document.getElementById('shdBlur').value;
        const spread = document.getElementById('shdSpread').value;
        const colorHex = document.getElementById('shdColor').value;
        const opacity = document.getElementById('shdOpacity').value;

        document.getElementById('valOffsetX').innerText = `${x}px`;
        document.getElementById('valOffsetY').innerText = `${y}px`;
        document.getElementById('valBlur').innerText = `${blur}px`;
        document.getElementById('valSpread').innerText = `${spread}px`;
        document.getElementById('valOpacity').innerText = opacity;

        const rgbaColor = hexToRgba(colorHex, opacity);
        const shadowVal = `${x}px ${y}px ${blur}px ${spread}px ${rgbaColor}`;

        demoCard.style.setProperty('--pv-shadow', shadowVal);

        if (format === 'css') {
          codeLanguage = 'css';
          generatedCode = `.custom-shadow {\n  box-shadow: ${shadowVal};\n}`;
        } else if (format === 'scss') {
          codeLanguage = 'scss';
          generatedCode = `$box-shadow-custom: ${shadowVal};\n\n.custom-shadow {\n  box-shadow: $box-shadow-custom;\n}`;
        } else if (format === 'json') {
          codeLanguage = 'json';
          generatedCode = JSON.stringify({ shadow: { custom: { value: shadowVal, type: "shadow" } } }, null, 2);
        } else if (format === 'ts') {
          codeLanguage = 'typescript';
          generatedCode = `export const shadows = {\n  custom: "${shadowVal}",\n} as const;`;
        } else if (format === 'tailwind') {
          codeLanguage = 'css';
          generatedCode = `@theme {\n  --shadow-custom: ${shadowVal};\n}`;
        }

      } else if (currentModule === 'converter') {
        const basePx = parseFloat(document.getElementById('basePx').value) || 16;
        const inputPx = parseFloat(document.getElementById('inputPx').value) || 0;
        const remVal = (inputPx / basePx).toFixed(4).replace(/\.?0+$/, '');

        demoCard.style.setProperty('--pv-shadow', 'none');

        if (format === 'css') {
          codeLanguage = 'css';
          generatedCode = `/* Base: ${basePx}px */\n.element {\n  font-size: ${remVal}rem; /* ${inputPx}px */\n}`;
        } else if (format === 'scss') {
          codeLanguage = 'scss';
          generatedCode = `// Base: ${basePx}px\n$font-size-custom: ${remVal}rem;`;
        } else if (format === 'json') {
          codeLanguage = 'json';
          generatedCode = JSON.stringify({ fontSize: { custom: { value: `${remVal}rem`, pixelEquivalent: `${inputPx}px` } } }, null, 2);
        } else if (format === 'ts') {
          codeLanguage = 'typescript';
          generatedCode = `export const typography = {\n  customSize: "${remVal}rem", // ${inputPx}px\n} as const;`;
        } else if (format === 'tailwind') {
          codeLanguage = 'css';
          generatedCode = `@theme {\n  --text-custom: ${remVal}rem;\n}`;
        }
      }

      // Actualizar clase de sintaxis y renderizar
      codeBlock.className = `language-${codeLanguage}`;
      codeBlock.textContent = generatedCode;
      
      if (window.Prism) {
        Prism.highlightElement(codeBlock);
      }
    }

    function copyCode() {
      navigator.clipboard.writeText(codeBlock.textContent).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = '¡Copiado!';
        setTimeout(() => btn.textContent = 'Copiar Código', 1500);
      });
    }

    // Listeners
    document.querySelectorAll('input, select').forEach(input => {
      input.addEventListener('input', render);
      input.addEventListener('change', render);
    });

    // Inicializar app
    render();
  </script>
</body>
</html>
